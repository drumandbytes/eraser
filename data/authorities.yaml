# Privacy / data protection authorities, worldwide.
#
# Where to complain if a data broker ignores or refuses a deletion request.
# `eraser export` names the authority for the data subject's `country`; the
# docs site renders the whole table grouped by `region`.
#
# EU/EEA entries are the GDPR supervisory authorities from the EDPB members
# list (edpb.europa.eu/about-edpb/about-edpb/members_en) - under GDPR Art. 77
# you complain to the one where you live, work, or where the infringement
# happened; `law` is omitted for them (it's always GDPR). Non-EU entries carry
# the relevant `law`. `website` is the authority's own site, in its own
# language. Re-check links before relying on them.

authorities:
  - country: Austria
    code: AT
    region: European Union / EEA
    authority: Österreichische Datenschutzbehörde (Austrian Data Protection Authority)
    acronym: DSB
    website: https://www.dsb.gv.at
  - country: Belgium
    code: BE
    region: European Union / EEA
    authority: Gegevensbeschermingsautoriteit / Autorité de la protection des données
    acronym: GBA/APD
    website: https://www.gegevensbeschermingsautoriteit.be
  - country: Bulgaria
    code: BG
    region: European Union / EEA
    authority: Commission for Personal Data Protection
    acronym: CPDP
    website: https://www.cpdp.bg
  - country: Croatia
    code: HR
    region: European Union / EEA
    authority: Agencija za zaštitu osobnih podataka
    acronym: AZOP
    website: https://azop.hr
  - country: Cyprus
