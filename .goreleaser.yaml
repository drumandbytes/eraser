# GoReleaser config - https://goreleaser.com
# Cut a release by pushing a tag: git tag v0.1.0 && git push origin v0.1.0
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: eraser
    main: ./cmd/eraser
    binary: eraser
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: eraser
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip, binary]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - EU-NOTES.md
      - LICENSE
      - config.example.yaml

checksum:
  name_template: checksums.txt

source:
  enabled: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request

release:
  github:
    owner: drumandbytes
    name: eraser
  draft: false
  prerelease: auto

# macOS: brew install drumandbytes/homebrew-tap/eraser
# (Homebrew strips the Gatekeeper quarantine on cask install, so no xattr dance.)
homebrew_casks:
  - name: eraser
    repository:
      owner: drumandbytes
      name: homebrew-tap
      branch: main
    directory: Casks
    homepage: "https://eraser.drumandbytes.dev"
    description: "Send data removal requests to data brokers"
    license: "MIT"
    commit_author:
      name: dnb-robot[bot]
      email: 4773076+dnb-robot[bot]@users.noreply.github.com
    caveats: |
      Config lives at ~/.eraser/config.yaml. Start with:
        eraser serve      # web UI at http://localhost:8080
      `eraser fill` / `eraser confirm` also need Chrome installed.
