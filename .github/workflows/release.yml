name: Release

on:
  # Tagged by release-please, or by hand: git tag v0.3.1 && git push origin v0.3.1
  push:
    tags:
      - "v*"
  # Smoke-test an existing release without publishing anything.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to smoke-test, e.g. v1.4.0
        required: true

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history + tags for the changelog and git describe

      # No caches: another ref's cache could end up in the published binaries.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false

      # dnb-robot, scoped to this repo and homebrew-tap (GoReleaser pushes the
      # cask); GITHUB_TOKEN can't write to another repo.
      - uses: actions/create-github-app-token@v3
        id: app_token
        with:
          client-id: ${{ secrets.DNB_ROBOT_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          owner: drumandbytes
          repositories: delistd,homebrew-tap

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}

  # The release is already published by now, so a failure here is an alarm, not
  # a gate. Download each binary as a user would, check it against
  # checksums.txt, and run it on the OS and architecture it was built for.
  smoke:
    name: Smoke test ${{ matrix.suffix }}
    needs: release
    # A manual run skips the release job; a failed release has nothing to test.
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, suffix: linux_amd64.tar.gz }
          - { os: ubuntu-24.04-arm, suffix: linux_arm64.tar.gz }
          - { os: macos-latest, suffix: darwin_arm64.tar.gz }
          - { os: macos-15-intel, suffix: darwin_amd64.tar.gz }
          - { os: windows-latest, suffix: windows_amd64.exe }
          - { os: windows-11-arm, suffix: windows_arm64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      # The script comes from the tagged commit, like the binaries do.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download, verify and run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SUFFIX: ${{ matrix.suffix }}
        run: ./scripts/release-smoke.sh "$TAG" "$SUFFIX"

  # Distroless image on ghcr.io/drumandbytes/delistd, built from the tagged
  # commit. Runs beside the GoReleaser job; a failure here leaves the binaries
  # and the GitHub release as they are.
  docker:
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # vX.Y.Z always; X.Y and latest only for a stable tag (no -rc suffix).
      - name: Compute tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # ghcr.io/drumandbytes/eraser is the pre-rename image name: same image under both
          # names until the next major release, so existing compose files keep pulling updates.
          version=${TAG#v}
          tags=""
          for image in ghcr.io/drumandbytes/delistd ghcr.io/drumandbytes/eraser; do
            tags+="$image:$TAG"$'\n'
            if [[ "$version" =~ ^([0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
              tags+="$image:${BASH_REMATCH[1]}"$'\n'"$image:latest"$'\n'
            fi
          done
          tags=${tags%$'\n'}
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # No cache-from/cache-to: another ref's cache could end up in the image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: delistd
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          provenance: mode=max
          sbom: true

  # The image is already pushed by now, so a failure here is an alarm, not a
  # gate. Pull the tag as a user would and run it on each architecture.
  docker-smoke:
    name: Smoke test image ${{ matrix.platform }}
    needs: docker
    # A manual run skips the docker job; a failed build has nothing to test.
    if: ${{ !cancelled() && needs.docker.result != 'failure' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux/amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Pull and run
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          image="ghcr.io/drumandbytes/delistd:$TAG"
          docker pull --platform "$PLATFORM" "$image"
          out=$(docker run --rm --platform "$PLATFORM" "$image" --version)
          echo "$out"
          echo "$out" | grep -q "${TAG#v}" || { echo "version output does not mention ${TAG#v}"; exit 1; }
          docker run --rm --platform "$PLATFORM" "$image" validate-brokers
