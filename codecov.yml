# Coverage of the code that ships. scripts/ is a maintainer import tool,
# data/ is embedded YAML, *test/ are test-only helper packages.
ignore:
  - "scripts/**"
  - "data/**"
  - "internal/imaptest/**"
  - "internal/smtptest/**"
  - "internal/testenv/**"

# Go reports coverage per block, so a multi-line block that ran only partly
# shows up as a "partial" line. Count those as hits, which is how
# `go tool cover` and scripts/covgate report it, so the numbers agree.
parsers:
  go:
    partials_as_hits: true

# The same limits are enforced in CI by scripts/covgate (ci.yml), which is what
# blocks a merge. These statuses only report, so installing Codecov's GitHub app
# adds nicer PR comments without a second gate.
coverage:
  status:
    project:
      default:
        target: auto # no worse than the base commit...
        threshold: 1% # ...give or take 1%
        informational: true
    patch:
      default:
        target: 80%
        informational: true

comment:
  layout: "diff, files"
  require_changes: true
