<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1f23" media="(prefers-color-scheme: dark)">
<title>{{ if .IsHome }}Eraser — data broker removal{{ else }}{{ .Title }} · Eraser{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
{{ partial "head-seo.html" . }}
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
<!-- No analytics beacon here on purpose. Cloudflare injects one at the edge for
     this host, and a hand-embedded tag would sit above it and win -- only the
     first beacon on a page is used -- which is exactly why this site recorded
     nothing while it had one. Never add one to internal/web/templates either:
     that's the self-hosted UI, and beaconing from a user's own machine to
     report their use of an erasure tool is what this product exists to avoid. -->
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ "/" | relURL }}">eraser</a>
  <nav>
    {{ range .Site.Menus.main }}<a href="{{ .URL | relLangURL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>{{ end }}
  </nav>
</header>
<main class="wrap">
{{ block "main" . }}{{ end }}
</main>
<footer class="foot">
  <a href="https://github.com/drumandbytes/eraser">Source</a> ·
  MIT licensed ·
  Not legal advice — you're responsible for what you send ·
  <a href="/privacy/">Privacy</a> ·
  <a href="https://github.com/drumandbytes/eraser/issues/new">Something wrong or missing?</a>
</footer>
</body>
</html>
