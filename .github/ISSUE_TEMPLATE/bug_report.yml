name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command(s) you ran, or what you clicked in the web UI
      placeholder: |
        1. eraser send --dry-run
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Eraser version
      description: Output of `eraser --version`, or the release/commit you built from
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - CLI
        - Web UI
        - Both
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Error messages or log output. Redact anything personal first - your `config.yaml`, email addresses, or broker reply contents.
      render: shell
