# EU/EEA (+ UK) data protection supervisory authorities.
#
# Where to complain if a data broker ignores or refuses your GDPR Article 17
# request. Under GDPR Art. 77 you may lodge a complaint with the authority in
# the member state of your habitual residence, place of work, or the place of
# the alleged infringement.
#
# `authority` names and `website` hosts are from the EDPB members list
# (edpb.europa.eu/about-edpb/about-edpb/members_en). `english_url` is filled in
# only where an English entry point is known; otherwise start from `website`
# and look for "complaint" / "Beschwerde" / "réclamation" / "reclamação" etc.
# Re-check the links before relying on them.

authorities:
  - country: Austria
    code: AT
    eea: true
    authority: Österreichische Datenschutzbehörde (Austrian Data Protection Authority)
    acronym: DSB
    website: https://www.dsb.gv.at
  - country: Belgium
    code: BE
    eea: true
    authority: Gegevensbeschermingsautoriteit / Autorité de la protection des données
    acronym: GBA/APD
    website: https://www.gegevensbeschermingsautoriteit.be
    english_url: https://www.dataprotectionauthority.be
  - country: Bulgaria
    code: BG
    eea: true
    authority: Commission for Personal Data Protection
    acronym: CPDP
    website: https://www.cpdp.bg
    english_url: https://www.cpdp.bg/en/
  - country: Croatia
    code: HR
    eea: true
    authority: Agencija za zaštitu osobnih podataka
    acronym: AZOP
    website: https://azop.hr
    english_url: https://azop.hr/en/
  - country: Cyprus
    code: CY
    eea: true
    authority: Office of the Commissioner for Personal Data Protection
    website: https://www.dataprotection.gov.cy
    english_url: https://www.dataprotection.gov.cy/dataprotection/dataprotection.nsf/home_en/home_en
  - country: Czech Republic
    code: CZ
    eea: true
    authority: Úřad pro ochranu osobních údajů (Office for Personal Data Protection)
    acronym: ÚOOÚ
    website: https://www.uoou.gov.cz
    english_url: https://www.uoou.gov.cz/en
  - country: Denmark
    code: DK
    eea: true
    authority: Datatilsynet
    website: https://www.datatilsynet.dk
    english_url: https://www.datatilsynet.dk/english
  - country: Estonia
    code: EE
    eea: true
    authority: Andmekaitse Inspektsioon (Data Protection Inspectorate)
    acronym: AKI
    website: https://www.aki.ee
    english_url: https://www.aki.ee/en
  - country: Finland
    code: FI
    eea: true
    authority: Office of the Data Protection Ombudsman (Tietosuojavaltuutetun toimisto)
    website: https://tietosuoja.fi
    english_url: https://tietosuoja.fi/en/home
  - country: France
    code: FR
    eea: true
    authority: Commission Nationale de l'Informatique et des Libertés
    acronym: CNIL
    website: https://www.cnil.fr
    english_url: https://www.cnil.fr/en
  - country: Germany
    code: DE
    eea: true
    authority: Die Bundesbeauftragte für den Datenschutz und die Informationsfreiheit
    acronym: BfDI
    website: https://www.bfdi.bund.de
    english_url: https://www.bfdi.bund.de/EN/Home/home_node.html
    notes: >-
      For a complaint against a private company (a data broker), a resident
      normally goes to the supervisory authority of their own federal state
      (Land), not the federal BfDI. The BfDI site links the list of the 16
      Landesdatenschutzbehörden.
  - country: Greece
    code: GR
