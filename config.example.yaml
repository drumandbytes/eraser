# Eraser Configuration Example
# Copy this file to ~/.eraser/config.yaml and fill in your details

profiles:
  # One entry per person; most installs only need this one. More via
  # `eraser profile add` (see docs/multi-profile.md).
  - id: default
    # Required: Your personal information for removal requests
    first_name: John
    last_name: Doe
    email: john.doe@example.com

    # Optional: other spellings brokers may have indexed you under -
    # e.g. a diacritic-free version of your name, a maiden name, a nickname
    # name_variants:
    #   - John Doe

    # Optional: other email addresses you've used over the years - brokers
    # often indexed your record under an old one
    # additional_emails:
    #   - old.address@example.com

    # Optional: Additional info helps brokers locate your records
    address: "123 Main Street"
    city: "San Francisco"
    state: "CA"
    zip_code: "94102"
    country: "USA"

    # Optional: places you've lived recently enough (last 5-7 years, say) that
    # a broker might still have the record. A partial address (no apartment
    # number) is still worth including - most broker matching keys off
    # street/city/postal code, not the exact unit.
    # previous_addresses:
    #   - Old Street 1, Old City, OC-12345
    phone: "+1-555-123-4567"
    date_of_birth: "1990-01-15"  # Format: YYYY-MM-DD

email:
  from: john.doe@example.com

  # Any SMTP provider. Presets the setup wizard knows (host:port):
  #   Gmail smtp.gmail.com:465, Proton Bridge 127.0.0.1:1025, Fastmail
  #   smtp.fastmail.com:465, mailbox.org smtp.mailbox.org:465, Posteo
  #   posteo.de:465, iCloud smtp.mail.me.com:587, Amazon SES
  #   email-smtp.<region>.amazonaws.com:465 (username = SES SMTP user).
  # Port 465 uses TLS from the start; any other port requires STARTTLS.
  smtp:
    host: smtp.fastmail.com
    port: 465
    username: john.doe@example.com
    password: your-app-password  # Use app password, not your regular password!
    # use_tls: false  # only for an unauthenticated local relay; TLS is on by default

options:
  # Template to use: "gdpr", "ccpa", or "generic"
  # Set to gdpr by default here since this copy is configured for an EU resident.
  template: gdpr

  # How removal emails leave your machine:
  #   smtp (default) - Eraser sends them over the `email:` account above.
  #   manual         - Eraser never sends. It renders the emails for you to
  #                    send by hand ('eraser draft', 'eraser send --manual',
  #                    or the web UI's per-broker "Email" page), and you record
  #                    each with 'eraser mark-sent'. No `email:` block needed.
  # send_mode: manual

  # Delay between emails in milliseconds (avoid spam filters)
  rate_limit_ms: 2000

  # Max emails `send` will dispatch per rolling 24h window, to stay under
  # your provider's daily sending cap. Gmail's is ~500/day for a regular
  # account - default here (450) leaves headroom; other providers differ. Brokers already emailed
  # in the last 25 days are skipped automatically, so re-running `send` on
  # a large broker list resumes where it left off without double-emailing.
  # Override per-run with --ignore-daily-limit or --resend.
  daily_send_limit: 450

  # Which built-in broker list to use (optional):
  #   full (default) - the full ~750-entry list
  #   verified       - a smaller list built from public data-broker registries
  #                    (US state registries + EU credit bureaus); every entry is
  #                    a confirmed data broker with a working removal contact.
  # Override per-run with `eraser send --list verified`.
  # broker_list: verified

  # Use your own broker list instead of a built-in one (optional). Same effect
  # as the global --brokers flag, which still wins if both are set.
  # broker_file: /home/you/.eraser/my-brokers.yaml

  # Only send to brokers in these regions (optional)
  # regions:
  #   - us
  #   - global

  # Skip these brokers (optional)
  # excluded_brokers:
  #   - spokeo
  #   - whitepages

  # Skip every broker in these categories (optional) - e.g. "requires-id" to
  # skip brokers that demand a government-issued ID document before they'll
  # act on a request (this tool won't supply one on your behalf)
  # excluded_categories:
  #   - requires-id

# Automation (optional). The best option is 'eraser schedule install' (or
# Settings -> Automation -> "Schedule with my OS"), which runs Eraser every
# 6 hours even with the web UI closed. Where that isn't available, this makes
# a running 'eraser serve' do the same while it's open:
# schedule:
#   enabled: true
