{{if .Excluded}}
<span class="badge badge-neutral">Excluded</span>
<button
    class="btn btn-ghost text-sm py-1 px-3"
    hx-post="/api/brokers/{{.ID}}/include"
    hx-target="#actions-{{.ID}}"
    hx-swap="innerHTML"
>
    Include
</button>
{{else}}
{{if .Email}}
<button
    class="btn btn-ghost text-sm py-1 px-3"
    hx-post="/api/send/{{.ID}}"
    hx-target="#status-{{.ID}}"
    hx-swap="innerHTML"
    hx-indicator="#spinner-{{.ID}}"
>
    Send
    <span id="spinner-{{.ID}}" class="htmx-indicator ml-1">
        <span class="spinner"></span>
    </span>
</button>
{{else}}
<button class="btn btn-ghost text-sm py-1 px-3" disabled title="No email on file">
    Send
</button>
{{end}}
{{if .OptOutURL}}
<a href="{{.OptOutURL}}" target="_blank" class="btn btn-ghost text-sm py-1 px-3">
    Opt-out
    <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
    </svg>
</a>
{{end}}
<button
    class="btn btn-ghost text-sm py-1 px-3 text-error"
    hx-post="/api/brokers/{{.ID}}/exclude"
    hx-target="#actions-{{.ID}}"
    hx-swap="innerHTML"
    title="Exclude this broker from sends"
>
    Exclude
</button>
{{end}}
<div id="actions-mobile-{{.ID}}" hx-swap-oob="innerHTML">
    {{if .Excluded}}
    <button class="btn btn-secondary flex-1 py-2" disabled>Excluded</button>
    <button
        class="btn btn-primary py-2"
        hx-post="/api/brokers/{{.ID}}/include"
        hx-target="#actions-mobile-{{.ID}}"
        hx-swap="innerHTML"
    >
        Include
    </button>
    {{else}}
    {{if .Email}}
    <button
        class="btn btn-primary flex-1 py-2"
        hx-post="/api/send/{{.ID}}"
        hx-target="#status-mobile-{{.ID}}"
        hx-swap="innerHTML"
    >
        Send Request
    </button>
    {{else}}
    <button class="btn btn-primary flex-1 py-2" disabled title="No email on file">
        No Email on File
    </button>
    {{end}}
    {{if .OptOutURL}}
    <a href="{{.OptOutURL}}" target="_blank" class="btn btn-secondary py-2">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
    </a>
    {{end}}
    <button
        class="btn btn-ghost py-2 text-error"
        hx-post="/api/brokers/{{.ID}}/exclude"
        hx-target="#actions-mobile-{{.ID}}"
        hx-swap="innerHTML"
        title="Exclude this broker from sends"
    >
        Exclude
    </button>
    {{end}}
</div>
