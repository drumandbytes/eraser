{{define "content"}}
<div class="min-h-[80vh] flex items-center justify-center py-8">
    <div class="max-w-lg w-full fade-in-up">
        <div class="card p-8">
            <!-- Progress Steps -->
            <div class="flex justify-center mb-8">
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-white" style="background: var(--accent);">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                    </div>
                    <div class="w-12 h-1 rounded" style="background: var(--accent);"></div>
                    <div class="w-10 h-10 rounded-full flex items-center justify-center font-display font-bold text-white" style="background: var(--accent);">2</div>
                    <div class="w-12 h-1 rounded" style="background: var(--border);"></div>
                    <div class="w-10 h-10 rounded-full flex items-center justify-center font-display font-bold" style="background: var(--bg-elevated); color: var(--text-muted);">3</div>
                </div>
            </div>

            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="font-display text-2xl font-bold text-primary mb-2">Your Information</h1>
                <p class="text-secondary">This will be used in your removal requests</p>
            </div>

            <form method="POST" action="/setup/profile" class="space-y-6">
                {{.CSRFField}}

                {{template "profile-fields" .}}

                <!-- Navigation -->
                <div class="flex items-center justify-between pt-6">
                    <a href="/setup" class="btn btn-ghost">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                        Back
                    </a>
                    <button type="submit" class="btn btn-primary">
                        Continue
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{{end}}

{{template "layout" .}}
