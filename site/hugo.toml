baseURL = "https://eraser.drumandbytes.dev/"
# locale is derived from the default language; no explicit setting needed
title = "Eraser"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]
enableGitInfo = true

# Broker pages are generated, so git has no history for them; their
# last_checked date is the real freshness signal. Feeds <lastmod> in the sitemap.
[frontmatter]
  lastmod = ["last_checked", ":git", "lastmod", "date"]

[params]
  description = "Send data removal requests to data brokers. Open source, local-first, free."
  repo = "https://github.com/drumandbytes/eraser"

[markup.goldmark.renderer]
  unsafe = true

[[menu.main]]
  name = "Broker directory"
  pageRef = "/brokers"
  weight = 10
[[menu.main]]
  name = "Guides"
  pageRef = "/guides"
  weight = 20
[[menu.main]]
  name = "Docs"
  pageRef = "/docs"
  weight = 25
[[menu.main]]
  name = "Authorities"
  pageRef = "/authorities"
  weight = 30
[[menu.main]]
  name = "GitHub"
  url = "https://github.com/drumandbytes/eraser"
  weight = 40

[mediaTypes."text/x-redirects"]
  suffixes = [""]

[outputFormats.REDIRECTS]
  mediaType = "text/x-redirects"
  baseName = "_redirects"
  isPlainText = true
  notAlternative = true

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "REDIRECTS", "LLMS"]
