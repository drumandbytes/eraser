  - country: Poland
    code: PL
    eea: true
    authority: Urząd Ochrony Danych Osobowych
    acronym: UODO
    website: https://uodo.gov.pl
  - country: Portugal
    code: PT
    eea: true
    authority: Comissão Nacional de Proteção de Dados
    acronym: CNPD
    website: https://www.cnpd.pt
  - country: Romania
    code: RO
    eea: true
