# Eraser Configuration Example
# Copy this file to ~/.eraser/config.yaml and fill in your details

profile:
  # Required: Your personal information for removal requests
  first_name: John
  last_name: Doe
  email: john.doe@example.com

  # Optional: other spellings brokers may have indexed you under -
  # e.g. a diacritic-free version of your name, a maiden name, a nickname
  # name_variants:
  #   - John Doe

  # Optional: other email addresses you've used over the years - brokers
  # often indexed your record under an old one
  # additional_emails:
  #   - old.address@example.com

  # Optional: Additional info helps brokers locate your records
  address: "123 Main Street"
  city: "San Francisco"
  state: "CA"
  zip_code: "94102"
  country: "USA"

  # Optional: places you've lived recently enough (last 5-7 years, say) that
  # a broker might still have the record. A partial address (no apartment
  # number) is still worth including - most broker matching keys off
  # street/city/postal code, not the exact unit.
  # previous_addresses:
  #   - Old Street 1, Old City, OC-12345
  phone: "+1-555-123-4567"
  date_of_birth: "1990-01-15"  # Format: YYYY-MM-DD

email:
  # Email provider: "smtp" or "sendgrid"
  provider: smtp
  from: john.doe@example.com

  # SMTP configuration (for Gmail, Outlook, etc.)
  smtp:
    host: smtp.gmail.com
    port: 465
    username: john.doe@gmail.com
    password: your-app-password  # Use app password, not your regular password!
    use_tls: true

  # SendGrid configuration (alternative to SMTP)
  # sendgrid:
  #   api_key: SG.xxxxxxxxxxxxxxxxxxxx

options:
  # Template to use: "gdpr", "ccpa", or "generic"
  # Set to gdpr by default here since this copy is configured for an EU resident.
  template: gdpr

  # Delay between emails in milliseconds (avoid spam filters)
  rate_limit_ms: 2000

  # Max emails `send` will dispatch per rolling 24h window, to stay under
  # your provider's daily sending cap. Gmail's is ~500/day for a regular
  # account - default here (450) leaves headroom. Brokers already emailed
  # in the last 25 days are skipped automatically, so re-running `send` on
  # a large broker list resumes where it left off without double-emailing.
  # Override per-run with --ignore-daily-limit or --resend.
  daily_send_limit: 450

  # Only send to brokers in these regions (optional)
  # regions:
  #   - us
  #   - global

  # Skip these brokers (optional)
  # excluded_brokers:
  #   - spokeo
  #   - whitepages

  # Skip every broker in these categories (optional) - e.g. "requires-id" to
  # skip brokers that demand a government-issued ID document before they'll
  # act on a request (this tool won't supply one on your behalf)
  # excluded_categories:
  #   - requires-id
