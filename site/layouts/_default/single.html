{{ define "main" }}
<article class="prose">
  <p class="crumb"><a href="{{ "/" | relURL }}">Home</a>{{ with .CurrentSection }} · <a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}</p>
  <h1>{{ .Title }}</h1>
  {{ if .Params.last_checked }}<p class="meta">Broker last checked {{ .Params.last_checked }}.</p>{{ end }}
  {{ .Content }}
</article>
{{ end }}
