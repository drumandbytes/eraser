  # --- North America ---
  - country: United States (federal)
    code: US
    region: North America
    law: FTC Act §5 (unfair or deceptive practices)
    authority: Federal Trade Commission
    acronym: FTC
    website: https://reportfraud.ftc.gov
    notes: >-
      The catch-all US regulator for data brokers, regardless of which state
      you live in. It doesn't act on individual complaints one by one, but
      complaints feed its enforcement and it has repeatedly sued data brokers.
  - country: United States (California)
    code: US-CA
    region: North America
    law: CCPA / CPRA
    authority: California Privacy Protection Agency
    acronym: CPPA
    website: https://cppa.ca.gov/
    notes: >-
      Runs the DELETE Act data-broker registry and (from 2026) the DROP
      one-request deletion service. Complaints also go to the California
      Attorney General: oag.ca.gov/privacy/ccpa.
  - country: United States (other states)
    code: US-OTHER
    region: North America
    law: State privacy acts (VA, CO, CT, UT, TX, OR, MT, ...)
    authority: Your state Attorney General's consumer-protection office
    website: https://www.usa.gov/state-attorney-general
    notes: >-
      Most US state privacy laws are enforced only by the state AG, with no
      individual complaint portal - but the AG's consumer-protection division
      takes complaints. Texas and Oregon also run data-broker registries.
  - country: Canada
    code: CA
    region: North America
    law: PIPEDA
    authority: Office of the Privacy Commissioner of Canada
    acronym: OPC
    website: https://www.priv.gc.ca/en/report-a-concern/
    notes: >-
      Quebec, British Columbia and Alberta have their own provincial
      commissioners for provincially-regulated businesses.

