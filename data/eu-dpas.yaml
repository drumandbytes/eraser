  - country: Iceland
    code: IS
    eea: true
    authority: Persónuvernd (Data Protection Authority)
    website: https://island.is/s/personuvernd
    notes: >-
      The authority's site moved onto Iceland's national portal island.is;
      www.personuvernd.is redirects there.
  - country: Liechtenstein
    code: LI
    eea: true
    authority: Datenschutzstelle (Data Protection Authority)
    acronym: DSS
    website: https://www.datenschutzstelle.li
  - country: Norway
    code: "NO"
    eea: true
    authority: Datatilsynet (Norwegian Data Protection Authority)
    website: https://www.datatilsynet.no
  - country: United Kingdom
    code: GB
    eea: false
    authority: Information Commissioner's Office
    acronym: ICO
    website: https://ico.org.uk
    notes: >-
      Not an EDPB member since Brexit; enforces the UK GDPR, which mirrors the
      EU GDPR's right to erasure. Relevant if you are a UK resident.
