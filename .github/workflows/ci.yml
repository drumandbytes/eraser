name: CI

on:
  pull_request:

# No paths-ignore: a filtered-out run never reports required-checks-passed,
# which the ruleset requires, so the PR could never merge.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: drumandbytes/reusable-actions/.github/workflows/go-ci.yml@v1
    with:
      test-race: true

  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  # Codecov's GitHub app isn't installed, so it posts no commit statuses and
  # can't be a required check. This enforces codecov.yml's rules here instead
  # (project floor and patch coverage) and still uploads the report to Codecov.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Codecov tokenless upload via OIDC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # the patch gate diffs against the base branch

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # No -race, so the IDLE watch test (race-tagged off for a go-imap v1
      # race) counts too.
      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          files: coverage.out

      - name: Coverage gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: go run ./scripts/covgate -profile coverage.out -base "origin/${BASE_REF}" -project-min 88 -patch-min 80

  # A broken site only surfaced after merge, when deploy.yaml ran on main.
  site:
    name: Site build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # the versioned docs read every release tag

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.165.0"

      - name: Build the site
        run: ./site/build.sh

  # The shared go-ci job covers Linux amd64. Release binaries also ship for
  # macOS, Windows and Linux arm64, so run the tests there too (no -race:
  # that needs cgo, and the release builds don't use it).
  cross-platform:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go test ./...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The one name the ruleset requires, however the jobs above change.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [ci, zizmor, coverage, site, cross-platform, vulncheck]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
