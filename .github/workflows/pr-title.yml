name: PR title

# release-please reads the squash-merge title to pick the version bump and the
# changelog entry, so a wrong type or an unconventional title changes the
# release. Advisory only: it isn't part of "Required checks passed" because
# ci.yml's concurrency group would cancel a running CI whenever a title was
# edited.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            build
            ci
            chore
            revert
          # Scopes are the convention (feat(mcp):) but `docs:` alone is used too.
          requireScope: false
