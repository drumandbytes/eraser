name: Auto merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  auto-merge:
    # The reusable workflow cannot grant itself more than the caller has, and
    # the org default for GITHUB_TOKEN is read-only — so declare it here.
    permissions:
      contents: write
      pull-requests: write
    # Only the conclusion is checked, not workflow_run.event: a same-repo
    # branch (which is how Dependabot pushes) triggers CI as 'push', not
    # 'pull_request', so gating on the event silently skipped every run. The
    # reusable workflow looks up the PR and enforces the author allow-list,
    # which is the actual safety gate; a run with no open PR just no-ops.
    if: github.event.workflow_run.conclusion == 'success'
    uses: drumandbytes/reusable-actions/.github/workflows/auto-merge.yml@v1
    with:
      # release-please's own PR; patch bumps auto-merge, minor/major don't.
      patch-only-authors: '["dnb-robot[bot]"]'
      # GITHUB_TOKEN-authored merges don't trigger further workflow runs, which
      # left a release-please release stuck (manifest/changelog bumped, no
      # tag/release/images ever built) — see drumandbytes/reusable-actions#16.
      # This merges with the dnb-robot app token instead, so the merge properly
      # cascades into another Release Please run that actually finishes the release.
      use-app-token-for-merge: true
    secrets: inherit
