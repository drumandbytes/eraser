  - country: Lithuania
    code: LT
    eea: true
    authority: Valstybinė duomenų apsaugos inspekcija (State Data Protection Inspectorate)
    acronym: VDAI
    website: https://vdai.lrv.lt
  - country: Luxembourg
    code: LU
    eea: true
    authority: Commission Nationale pour la Protection des Données
    acronym: CNPD
    website: https://cnpd.public.lu
  - country: Malta
    code: MT
    eea: true
    authority: Office of the Information and Data Protection Commissioner
