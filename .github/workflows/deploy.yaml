name: Deploy to Cloudflare Pages

# Cloudflare Pages, not GitHub Pages: Web Analytics needs proxied traffic.
# Not the reusable deploy, since this site builds with Go and Hugo.

on:
  push:
    branches: [main]
    paths:
      - "data/brokers.yaml"
      - "data/authorities.yaml"
      - "site/**"
      - "cmd/eraser/cmd_guides.go"
      - "internal/template/templates/**"
      - "internal/broker/**"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No module cache: another ref's cache could end up in the published site.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.165.0"

      - name: Generate content
        run: |
          go run ./cmd/eraser guides --format md --output site/content
          mkdir -p site/data
          cp data/authorities.yaml site/data/authorities.yaml

      - name: Build
        run: hugo --minify --source site

      # indexnow reads the sitemap from here; Cloudflare can refuse runner IPs.
      - uses: actions/upload-artifact@v7
        with:
          name: sitemap
          path: site/public/**/sitemap*.xml
          if-no-files-found: error
          retention-days: 1

      - uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4.1.2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/public --project-name=eraser --branch=main

  indexnow:
    needs: deploy
    uses: drumandbytes/reusable-actions/.github/workflows/indexnow.yml@v1
    with:
      host: eraser.drumandbytes.dev
      key: ${{ vars.INDEXNOW_KEY }}
      sitemap-artifact: sitemap
