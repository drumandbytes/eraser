name: Release

on:
  # Tagged by release-please, or by hand: git tag v0.3.1 && git push origin v0.3.1
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history + tags for the changelog and git describe

      # No caches: another ref's cache could end up in the published binaries.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      # dnb-robot, scoped to this repo and homebrew-tap (GoReleaser pushes the
      # cask); GITHUB_TOKEN can't write to another repo.
      - uses: actions/create-github-app-token@v3
        id: app_token
        with:
          client-id: ${{ secrets.DNB_ROBOT_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          owner: drumandbytes
          repositories: eraser,homebrew-tap

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
